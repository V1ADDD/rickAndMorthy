<header>
    <ul>
        @if (isActive('/login')) {
            <li>Login Page</li>
        }
        @else {
            <li [routerLink]="'/characters'" [class.active]="isActive('/characters')">Characters</li>
            <li [routerLink]="'/favorites'" [class.active]="isActive('/favorites')">Favorites</li>
            <li [routerLink]="'/locations'" [class.active]="isActive('/locations')">Locations</li>
            <li [routerLink]="'/episodes'" [class.active]="isActive('/episodes')">Episodes</li>
            <li (click)="logOut()">Logout</li>
            <li><img [src]="(user$ | async)?.image">{{ (user$ | async)?.username }}</li>
        }
    </ul>
    <hr>
</header>
<router-outlet />
