<header>
  <ul>
    @if (isGuest()) {
      <li>Login Page</li>
    } @else {
      @for (tab of tabs; track $index) {
        <li [routerLink]="'/' + tab" [class.active]="isActive('/' + tab)">{{ tab | titlecase }}</li>
      }
      <li (click)="logOut()" (keypress)="logOut()" tabindex="0" role="button">Logout</li>
      <li>{{ userSig() }}</li>
    }
  </ul>
  <hr />
</header>
<router-outlet />
