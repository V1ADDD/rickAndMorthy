<h1>Episodes</h1>
@if (isLoadingSig()) {
  <p>Загрузка...</p>
} @else {
  <div class="container">
    @for (episode of episodesSig(); track episode.id) {
      <div class="episode-info">
        <h2>{{ episode.name }}</h2>
        <p>Air date: {{ episode.air_date }}</p>
        <p>Episode: {{ episode.episode }}</p>
        <p>Created: {{ episode.created | date: 'short' }}</p>
      </div>
    }
  </div>
  <div class="pagination">
    <button mat-icon-button (click)="loadPage(1)" [disabled]="currentPageSig() === 1">1</button>
    <button
      mat-icon-button
      (click)="loadPage(currentPageSig() - 1)"
      [disabled]="currentPageSig() === 1"
    >
      <
    </button>
    <button mat-icon-button disabled="true">{{ currentPageSig() }}</button>
    <button
      mat-icon-button
      (click)="loadPage(currentPageSig() + 1)"
      [disabled]="currentPageSig() === pagesSig()"
    >
      >
    </button>
    <button
      mat-icon-button
      (click)="loadPage(pagesSig())"
      [disabled]="currentPageSig() === pagesSig()"
    >
      {{ pagesSig() }}
    </button>
  </div>
}
